name: zoosy
description: "Zoosy - 主动思考记录应用"
publish_to: 'none'
version: 1.18.1+5

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  google_fonts: ^6.1.0
  shared_preferences: ^2.5.0
  crypto: ^3.0.6
  mailer: ^7.1.0
  image_picker: ^1.1.2
  path_provider: ^2.1.5
  path: ^1.9.1
  http: ^1.3.0
  flutter_local_notifications: ^18.0.1
  permission_handler: ^11.4.0
  share_plus: ^10.1.4
  home_widget: ^0.7.0
  speech_to_text: ^7.0.0
  timezone: ^0.10.0
  package_info_plus: ^8.0.0
  url_launcher: ^6.3.1


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/images/
